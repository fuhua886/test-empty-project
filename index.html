    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes likePop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }
        
        .card-animation {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        
        .card-hidden {
            opacity: 0;
        }
        
        .like-animation {
            animation: likePop 0.3s ease-out;
        }
        
        .game-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        
        .game-image {
            transition: transform 0.4s ease;
        }
        
        .game-card:hover .game-image {
            transform: scale(1.1);
        }
        
        .image-overlay {
            transition: opacity 0.3s ease;
        }
        
        .game-card:hover .image-overlay {
            opacity: 1;
        }
        
        .modal-enter {
            animation: fadeInUp 0.3s ease-out;
        }
        
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

            { id: 100, name: '夜族崛起', category: '生存', rating: 4.7, steamId: 1604030, shortDesc: '吸血鬼动作RPG', features: ['吸血鬼题材', '动作战斗', '生存建造', '开放世界'] }
        ];

        // DOM Elements
        const gamesGrid = document.getElementById('gamesGrid');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const resultsCount = document.getElementById('resultsCount');
        const gameModal = document.getElementById('gameModal');
        const closeModal = document.getElementById('closeModal');

        // State
        let currentFilter = 'all';
        let currentSearch = '';
        let currentSort = 'rating';

        // Get image URL
        function getGameImageUrl(steamId) {
            return `https://images.weserv.nl/?url=steamcdn-a.akamaihd.net/steam/apps/${steamId}/header.jpg`;
        }

        // Load likes from localStorage
        function getLikes() {
            const likes = localStorage.getItem('gameLikes');
            return likes ? JSON.parse(likes) : {};
        }

        // Save likes to localStorage
        function saveLikes(likes) {
            localStorage.setItem('gameLikes', JSON.stringify(likes));
        }

        // Toggle like
        function toggleLike(gameId, button) {
            const likes = getLikes();
            if (likes[gameId]) {
                likes[gameId]++;
            } else {
                likes[gameId] = 1;
            }
            saveLikes(likes);
            
            const likeIcon = button.querySelector('.like-icon');
            likeIcon.classList.add('like-animation');
            setTimeout(() => likeIcon.classList.remove('like-animation'), 300);
            
            updateLikeButton(button, likes[gameId]);
        }

        // Update like button
        function updateLikeButton(button, count) {
            button.querySelector('.like-count').textContent = count;
            button.classList.add('bg-red-500');
            button.classList.remove('bg-white/10');
        }

        // Create game card
        function createGameCard(game) {
            const likes = getLikes();
            const card = document.createElement('div');
            card.className = 'game-card bg-gradient-to-br from-gray-800/80 to-gray-900/80 backdrop-blur-md rounded-xl overflow-hidden border border-white/10 card-hidden';
            card.innerHTML = `
                <div class="relative h-48 overflow-hidden">
                    <img 
                        src="${getGameImageUrl(game.steamId)}" 
                        alt="${game.name}" 
                        class="game-image w-full h-full object-cover"
                        onerror="this.style.display='none'; this.parentElement.querySelector('.fallback-image').style.display='flex';"
                    />
                    <div class="fallback-image hidden absolute inset-0 bg-gradient-to-br from-purple-600 to-gray-700 flex items-center justify-center">
                        <span class="text-white text-2xl font-bold text-center px-2">${game.name}</span>
                    </div>
                    <div class="image-overlay absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0"></div>
                    <span class="absolute top-3 left-3 px-2 py-1 bg-purple-600 rounded text-xs text-white font-medium">${game.category}</span>
                    <div class="absolute top-3 right-3 flex items-center gap-1 px-2 py-1 bg-black/60 rounded-full">
                        <i class="fa-solid fa-star text-yellow-400 text-xs"></i>
                        <span class="text-white text-xs font-medium">${game.rating}</span>
                    </div>
                </div>
                <div class="p-4">
                    <h3 class="text-white font-semibold mb-2 truncate">${game.name}</h3>
                    <p class="text-gray-400 text-sm mb-4 line-clamp-2">${game.shortDesc}</p>
                    <button 
                        class="like-btn flex items-center gap-2 px-3 py-2 rounded-full bg-white/10 hover:bg-white/20 text-white text-sm transition-colors"
                        onclick="toggleLike(${game.id}, this)"
                    >
                        <i class="fa-solid fa-heart like-icon"></i>
                        <span class="like-count">${likes[game.id] || 0}</span>
                    </button>
                </div>
            `;
            
            // Open modal on card click
            card.addEventListener('click', (e) => {
                if (!e.target.closest('.like-btn')) {
                    openModal(game);
                }
            });

            // Initialize like button state
            const likeBtn = card.querySelector('.like-btn');
            if (likes[game.id]) {
                updateLikeButton(likeBtn, likes[game.id]);
            }

            return card;
        }

        // Open modal
        function openModal(game) {
            document.getElementById('modalImage').src = getGameImageUrl(game.steamId);
            document.getElementById('modalTitle').textContent = game.name;
            document.getElementById('modalCategory').textContent = game.category;
            document.getElementById('modalRating').textContent = game.rating;
            document.getElementById('modalDescription').textContent = game.shortDesc;
            
            const featuresList = document.getElementById('modalFeatures');
            featuresList.innerHTML = '';
            game.features.forEach(feature => {
                const li = document.createElement('li');
                li.innerHTML = `<i class="fa-solid fa-check text-purple-400 mr-2"></i>${feature}`;
                featuresList.appendChild(li);
            });
            
            gameModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        // Close modal
        closeModal.addEventListener('click', () => {
            gameModal.classList.add('hidden');
            document.body.style.overflow = '';
        });

        // Close modal on overlay click
        gameModal.addEventListener('click', (e) => {
            if (e.target === gameModal) {
                gameModal.classList.add('hidden');
                document.body.style.overflow = '';
            }
        });

        // Filter and sort games
        function filterAndSortGames() {
            let filtered = [...gamesData];
            
            // Search filter
            if (currentSearch) {
                const searchLower = currentSearch.toLowerCase();
                filtered = filtered.filter(game => game.name.toLowerCase().includes(searchLower));
            }
            
            // Category filter
            if (currentFilter !== 'all') {
                filtered = filtered.filter(game => game.category === currentFilter);
            }
            
            // Sort
            if (currentSort === 'rating') {
                filtered.sort((a, b) => b.rating - a.rating);
            } else {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            }
            
            return filtered;
        }

        // Render games
        function renderGames() {
            const filteredGames = filterAndSortGames();
            resultsCount.textContent = `共 ${filteredGames.length} 款游戏`;
            
            // Clear grid
            gamesGrid.innerHTML = '';
            
            // Add cards with animation delay
            filteredGames.forEach((game, index) => {
                const card = createGameCard(game);
                card.style.animationDelay = `${index * 50}ms`;
                setTimeout(() => {
                    card.classList.remove('card-hidden');
                }, index * 50);
                gamesGrid.appendChild(card);
            });
        }

        // Event listeners
        searchInput.addEventListener('input', (e) => {
            currentSearch = e.target.value;
            renderGames();
        });

        sortSelect.addEventListener('change', (e) => {
            currentSort = e.target.value;
            renderGames();
        });

        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                // Update active state
                filterButtons.forEach(b => b.classList.remove('bg-purple-600', 'active'));
                btn.classList.add('bg-purple-600', 'active');
                
                currentFilter = btn.dataset.filter;
                renderGames();
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !gameModal.classList.contains('hidden')) {
                gameModal.classList.add('hidden');
                document.body.style.overflow = '';
            }
        });

        // Initial render
        renderGames();
    </script>
